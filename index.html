    const qd = (opts.q && ctx) ? quantInfo() : null;
    const delay = qd ? qd.delay : 0;               // 音を待たせるぶん、見た目(輪っか・棚の光)も同じだけ待たせる
    if (!reduce) { ripples.push({x:e.x, y:e.y, t:now + delay}); if (ripples.length > 16) ripples.shift(); }
    if (e.kind === 'board') flashAt[e.idx] = now + delay;
    if (!ctx) return;
    while (recent.length && now - recent[0] > 0.12) recent.shift();
    const v = Math.max(0.25, Math.min(1, e.imp / 650));
    for (const f of (e.b ? [e.a, e.b] : [e.a])) {
      if (recent.length >= 6 || now - f.last < 0.07) continue;
      if (qd) {                                    // 同じ拍に重なる音は6つまで
        if (qTickK !== qd.k) { qTickK = qd.k; qTickN = 0; }
        if (qTickN >= 6) continue;
        qTickN++;
      }
      f.last = now; recent.push(now);
      fruitNote(f, e.x, v, delay);
      if (rec) recNote(f, e.x, v, now, qd ? qd.k : undefined);   // 実際に鳴った音だけをきろくする
    }
  }

  function drawStage(now){
    const sc = stage.width / BW;
    sctx.setTransform(sc, 0, 0, sc, 0, 0);
    sctx.clearRect(0, 0, BW, BH);
    // 5つの音の帯(左が低く、右が高い)
    for (let k = 0; k < 5; k++) {
      if (k % 2 === 0) { sctx.globalAlpha = 0.55; sctx.fillStyle = pal.cell; sctx.fillRect(k*BW/5, 0, BW/5, BH); sctx.globalAlpha = 1; }
    }
    sctx.fillStyle = pal.muted; sctx.font = '700 11px sans-serif'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    ZONES.forEach((n, k) => sctx.fillText(n, (k + 0.5)*BW/5, 12));
    // 棚(ぶつかると光る)
    sctx.lineCap = 'round';
    world.boards.forEach((b, i) => {
      sctx.lineWidth = world.thick*2; sctx.strokeStyle = pal.shelf;
      sctx.beginPath(); sctx.moveTo(b.x1, b.y1); sctx.lineTo(b.x2, b.y2); sctx.stroke();
      const fa = now - flashAt[i], fl = 1 - fa / 0.3;
      if (fa >= 0 && fl > 0) { sctx.globalAlpha = fl; sctx.strokeStyle = pal.accent; sctx.beginPath(); sctx.moveTo(b.x1, b.y1); sctx.lineTo(b.x2, b.y2); sctx.stroke(); sctx.globalAlpha = 1; }
    });
    sctx.fillStyle = pal.shelf;
    world.pegs.forEach(p => { sctx.beginPath(); sctx.arc(p.x, p.y, p.r, 0, Math.PI*2); sctx.fill(); });
    sctx.fillRect(0, world.floor, BW, BH - world.floor);
    // 風: 流れ線(風がふいているときだけ。動きを減らす設定のときは出さない)
    if (opts.wind && !reduce) {
      const ax = curWind[0], dir = ax >= 0 ? 1 : -1;
      sctx.lineWidth = 1.5; sctx.lineCap = 'round'; sctx.strokeStyle = pal.muted;
      sctx.globalAlpha = 0.1 + 0.22*Math.min(1, Math.abs(ax) / 300);
      for (const s of streaks) {
        s.x += (ax*0.6 + s.d) * frameDt;
        if (s.x > BW + 30) s.x -= BW + 60; else if (s.x < -30) s.x += BW + 60;
        sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - dir*s.len, s.y); sctx.stroke();
      }
      sctx.globalAlpha = 1;
    }
    // 果物
    sctx.font = Math.round(BR*1.8) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    for (const f of world.fruits) {
      sctx.save(); sctx.translate(f.x, f.y); sctx.rotate(f.a);
      sctx.fillText(FR[f.fid].em, 0, 1);
      if (f.ice > 0) {
        sctx.beginPath(); sctx.arc(0, 0, BR + 1, 0, Math.PI*2);
        sctx.globalAlpha = 0.38*f.ice; sctx.fillStyle = pal.ice; sctx.fill();
        sctx.globalAlpha = 0.45 + 0.55*f.ice; sctx.lineWidth = 2; sctx.strokeStyle = pal.ice; sctx.stroke();
        sctx.globalAlpha = 1;
      }
      if (f.ripe > 0) {                       // 熟していくほど、茶色いもやと斑点が濃くなる
        sctx.beginPath(); sctx.arc(0, 0, BR + 1, 0, Math.PI*2);
        sctx.globalAlpha = 0.34*f.ripe; sctx.fillStyle = pal.ripe; sctx.fill();
        sctx.globalAlpha = 0.4 + 0.6*f.ripe; sctx.lineWidth = 2; sctx.strokeStyle = pal.ripe; sctx.stroke();
        sctx.globalAlpha = 0.9*f.ripe; sctx.fillStyle = pal.ripe;
        [[-6, -4, 1.8], [5, -1, 1.8], [-2, 6, 1.5]].forEach(([dx, dy, rr]) => { sctx.beginPath(); sctx.arc(dx, dy, rr, 0, Math.PI*2); sctx.fill(); });
        sctx.globalAlpha = 1;
      }
      sctx.restore();
    }
    // ぶつかった印
    for (let i = ripples.length - 1; i >= 0; i--) {
      const age = (now - ripples[i].t) / 0.35;
      if (age >= 1) { ripples.splice(i, 1); continue; }
      if (age < 0) continue;                  // リズム補正で、まだ鳴る前の輪っか
      sctx.globalAlpha = 1 - age; sctx.lineWidth = 2; sctx.strokeStyle = pal.accent;
      sctx.beginPath(); sctx.arc(ripples[i].x, ripples[i].y, 6 + age*16, 0, Math.PI*2); sctx.stroke();
      sctx.globalAlpha = 1;
    }
    // きろく中: 上に2小節ぶんの進みぐあい(16ステップの目盛り、小節の境目は長め)
    if (rec) {
      const p = Math.max(0, Math.min(1, (now - rec.t0) / rec.end));
      sctx.fillStyle = pal.cell; sctx.fillRect(0, 0, BW, 6);
      sctx.fillStyle = pal.accent; sctx.fillRect(0, 0, BW*p, 6);
      sctx.fillStyle = pal.ink; sctx.globalAlpha = 0.4;
      for (let i = 1; i < STEPS; i++) sctx.fillRect(BW*i/STEPS - 0.5, 0, 1, i % 8 === 0 ? 6 : 3);
      sctx.globalAlpha = 1;
    }
    if (mode === 'design') drawDesign();
    // 風の向きと強さ(上の真ん中の矢印)
    if (opts.wind && mode !== 'design') {
      const len = Math.max(-1, Math.min(1, curWind[0] / 400)) * 36, cx = BW/2, wy0 = 30;
      sctx.strokeStyle = pal.accent; sctx.fillStyle = pal.accent; sctx.globalAlpha = 0.8; sctx.lineWidth = 2.5; sctx.lineCap = 'round';
      sctx.beginPath(); sctx.moveTo(cx, wy0); sctx.lineTo(cx + len, wy0); sctx.stroke();
      if (Math.abs(len) > 6) {
        const d = len > 0 ? 1 : -1;
        sctx.beginPath(); sctx.moveTo(cx + len, wy0); sctx.lineTo(cx + len - d*7, wy0 - 4.5); sctx.lineTo(cx + len - d*7, wy0 + 4.5); sctx.closePath(); sctx.fill();
      }
      sctx.beginPath(); sctx.arc(cx, wy0, 2.5, 0, Math.PI*2); sctx.fill();
      sctx.globalAlpha = 1;
    }
  }
  // 設計モードの重ね描き: 板の端の丸い持ち手、ペグのまわりの点線、いま作っている板の予告線
  function drawDesign(){
    sctx.lineCap = 'round';
    sctx.setLineDash([3, 3]); sctx.lineWidth = 1.5; sctx.strokeStyle = pal.muted;
    world.pegs.forEach(p => { sctx.beginPath(); sctx.arc(p.x, p.y, p.r + 5, 0, Math.PI*2); sctx.stroke(); });
    sctx.setLineDash([]);
    const knob = (x, y, on) => {
      sctx.beginPath(); sctx.arc(x, y, on ? 10 : 8, 0, Math.PI*2);
      sctx.fillStyle = pal.cell; sctx.fill(); sctx.lineWidth = 2.5; sctx.strokeStyle = on ? pal.accent : pal.ink; sctx.stroke();
    };
    world.boards.forEach((b, i) => {
      const a = drag && drag.type === 'end' && drag.i === i ? drag.end : 0;
      knob(b.x1, b.y1, a === 1); knob(b.x2, b.y2, a === 2);
    });
    if (drag && drag.type === 'new') {
      const ok = Math.hypot(drag.x1 - drag.x0, drag.y1 - drag.y0) >= world.limits.minLen;
      sctx.setLineDash([7, 6]); sctx.lineWidth = world.thick*2; sctx.strokeStyle = ok ? pal.accent : pal.muted; sctx.globalAlpha = 0.8;
      sctx.beginPath(); sctx.moveTo(drag.x0, drag.y0); sctx.lineTo(drag.x1, drag.y1); sctx.stroke();
      sctx.setLineDash([]); sctx.globalAlpha = 1;
      knob(drag.x0, drag.y0, true); knob(drag.x1, drag.y1, true);
    }
    if (drag && drag.type === 'peg' && world.pegs[drag.i]) { const q = world.pegs[drag.i]; sctx.lineWidth = 2.5; sctx.strokeStyle = pal.accent; sctx.beginPath(); sctx.arc(q.x, q.y, q.r + 5, 0, Math.PI*2); sctx.stroke(); }
  }
  function bframe(ts){
    if (!bRun) return;
    const now = ts / 1000, H = 1/120;
    const dtf = Math.min(0.05, bLast ? now - bLast : 0.016);
    bAcc += dtf; bLast = now; frameDt = dtf;
    if (mode !== 'design') {          // 設計モードでは果物も風も止めて、置くことだけに集中する
      curWind = wind.at(opts.wind, now); world.setWind(curWind[0], curWind[1]);
      const evs = []; let n = 0;
      while (bAcc >= H && n < 8) { world.step(H, evs); bAcc -= H; n++; }
      if (n === 8) bAcc = 0;
      evs.forEach(e => onHit(e, now));
      if (rec) recTick(now);
      watchJam(dtf);
    } else bAcc = 0;
    drawStage(now);
    requestAnimationFrame(bframe);
  }
  // 3秒以上、宙でじっと止まっている果物がいたら、「ゆらす」をすすめる(板の上で休んでいるだけのこともあるので、やさしい言い方で)
  function watchJam(dt){
    let still = false;
    for (const f of world.fruits) if (Math.hypot(f.vx, f.vy) < 12 && f.y < world.floor - BR - 6) { still = true; break; }
    jamAcc = still ? jamAcc + dt : 0;
    if (!still) jamShown = false;
    else if (jamAcc > 3 && !jamShown) { jamShown = true; $('optmsg').textContent = '止まっている果物がいるよ。「ゆらす」を押すと、ぽんと動くよ。'; }
  }
  function bounceStart(){ bRun = true; bLast = 0; bAcc = 0; qOrigin = performance.now() / 1000; readPal(); fitStage(); requestAnimationFrame(bframe); }
  function bounceStop(){ bRun = false; }
  if (window.ResizeObserver) new ResizeObserver(() => { if (bRun) fitStage(); }).observe(stage);
  else window.addEventListener('resize', () => { if (bRun) fitStage(); });
  new MutationObserver(() => { if (pal) readPal(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if (pal) readPal(); });
  }

  stage.addEventListener('click', (e) => {
    if (mode === 'design') return;
    const ok = initAudio();
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * BW, y = (e.clientY - r.top) / r.height * BH;
    const hit = world.pick(x, y);
    if (tool === 'erase') { if (hit) world.remove(hit); return; }
    if (tool === 'ice') {
      if (!hit) { setHint('凍らせるには、落ちている果物をタップしてね。', true); return; }
      world.freeze(hit);
      if (ok) fruitNote(hit, hit.x, 0.8);
      return;
    }
    if (tool === 'ripe') {
      if (!hit) { setHint('熟成させるには、落ちている果物をタップしてね。', true); return; }
      world.ripen(hit);
      return;
    }
    if (hit) { world.poke(hit); return; }
    world.add(tool, x);
  });
  $('drop').addEventListener('click', () => {
    initAudio();
    world.add(FR[tool] ? tool : lastFruit, BR + Math.random()*(BW - 2*BR));
  });
  $('shake').addEventListener('click', () => { initAudio(); world.shake(); jamShown = false; jamAcc = 0; });
  $('sweep').addEventListener('click', () => { world.clear(); jamAcc = 0; jamShown = false; setHint('果物だけ片づけました。板とペグはそのままだよ。', true); });

  /* ---------- ぶつけた音を棚にする ---------- */
  /* 2小節(16ステップ)ぶん、実際に鳴った音を時刻と場所つきで集め、棚のマスに丸める。
     時刻 → 8分音符ごとのステップ(いちばん近いマス) / 横位置 → 5つの帯(左=ド … 右=ラ) = 棚の下段〜上段 */
  let rec = null, recResult = null;
  const recBtn = $('rec'), recLabel = $('reclabel'), recMsg = $('recmsg'), recPanel = $('recpanel'),
        recMini = $('recmini'), recSum = $('recsum');
  const REC_LABEL = '2小節きろく';
  const recStepSec = () => 60 / bpm / 2;

  function updateRecHint(){
    if (rec) return;
    recMsg.textContent = 'きろくは約' + (STEPS * recStepSec()).toFixed(1) + '秒(いまのテンポ ' + bpm + ' BPM)。ぶつかって鳴った音が、2小節の棚になるよ。';
  }
  function recStart(){
    if (!initAudio()) { recMsg.textContent = 'このブラウザでは音を鳴らせません。'; return; }
    const step = recStepSec();
    const t0 = performance.now() / 1000;
    rec = {t0, step, end: step * STEPS, notes: [], shown: -1};
    qOrigin = t0;   // リズム補正の拍の数え始めも、きろくの頭にそろえる
    recResult = null; recPanel.hidden = true;
    tempo.disabled = true; pickRow.classList.add('off'); pickSel.disabled = true;
    recBtn.setAttribute('aria-pressed', 'true');
    recLabel.textContent = 'きろく中… あと' + rec.end.toFixed(1) + '秒';
    recMsg.textContent = '鳴った音を記録しているよ。果物を落としたり、跳ねさせたりしてね。(もう一度おすと中止)';
  }
  function recReset(){
    rec = null; tempo.disabled = false; pickRow.classList.remove('off'); pickSel.disabled = false;
    recBtn.setAttribute('aria-pressed', 'false'); recLabel.textContent = REC_LABEL;
  }
  function recCancel(msg){
    if (!rec) return;
    recReset();
    recMsg.textContent = msg || 'きろくをやめました。';
  }
  // qk: リズム補正がONのとき、その音が鳴る拍の番号(きろくの頭から数える)。OFFのときは、いちばん近いマスに丸める。
  function recNote(f, x, v, now, qk){
    const t = now - rec.t0;
    if (t < -0.05 || t > rec.end + rec.step) return;
    const s = qk !== undefined ? ((qk % STEPS) + STEPS) % STEPS : Math.max(0, Math.min(STEPS - 1, Math.round(t / rec.step)));
    const k = Math.max(0, Math.min(4, Math.floor(x / BW * 5)));   // 0=ド(左) … 4=ラ(右)
    rec.notes.push({s, r:4 - k, f:f.fid, ice:f.ice > 0.5, ripe:f.ripe > 0.5, v});
  }
  function recTick(now){
    const t = now - rec.t0;
    if (t >= rec.end) { recFinish(); return; }
    const left = Math.ceil((rec.end - t) * 10) / 10;
    if (left !== rec.shown) { rec.shown = left; recLabel.textContent = 'きろく中… あと' + left.toFixed(1) + '秒'; }
  }
  function renderMini(g){
    let h = '';
    for (let b = 0; b < 2; b++) {
      h += '<div class="recbar">';
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < 8; c++) {
        const cell = g[b*8 + c][r];
        h += cell ? '<span class="mc on f-' + cell.f + (cell.ripe ? ' ripe' : cell.ice ? ' ice' : '') + '">' + FR[cell.f].em + '</span>' : '<span class="mc"></span>';
      }
      h += '</div>';
    }
    recMini.innerHTML = h;
  }
  function recFinish(){
    const notes = rec.notes;
    recReset();
    // 同じマスに重なった音は、勢いの強いほうを残す
    const best = new Map(); let dropped = 0;
    notes.forEach(n => {
      const key = n.s * ROWS + n.r, b = best.get(key);
      if (!b) best.set(key, n);
      else { dropped++; if (n.v > b.v) best.set(key, n); }
    });
    if (!best.size) {
      recResult = null; recPanel.hidden = true;
      recMsg.textContent = '音が記録されませんでした。果物を落としてから、もう一度きろくしてね。';
      return;
    }
    const g = emptyGrid();
    best.forEach(n => { g[n.s][n.r] = {f:n.f, ice:n.ice, ripe:n.ripe}; });
    recResult = {g, count:best.size, dropped};
    renderMini(g);
    recSum.textContent = best.size + '個の音を記録しました' + (dropped ? '(同じマスに重なった' + dropped + '個は、勢いの強いほうを残しました)' : '');
    recMini.setAttribute('aria-label', '記録した音の並び。' + best.size + '個');
    recPanel.hidden = false;
    recMsg.textContent = 'できたよ。棚に変換すると、あとから直せます。';
    try { recPanel.scrollIntoView({block:'nearest', behavior: reduce ? 'auto' : 'smooth'}); } catch (e) {}
  }
  function applyRec(how){
    if (!recResult) return;
    const g = recResult.g;
    takeSnap();
    let added = 0, skipped = 0;
    if (how === 'replace') {
      grid = JSON.parse(JSON.stringify(g)); added = recResult.count;
    } else {
      for (let s = 0; s < STEPS; s++) for (let r = 0; r < ROWS; r++) {
        if (!g[s][r]) continue;
        if (grid[s][r] || tieHead(grid, s, r) >= 0) skipped++; else { grid[s][r] = {f:g[s][r].f, ice:g[s][r].ice, ripe:!!g[s][r].ripe}; added++; }
      }
    }
    setMode('shelf');
    paintAll(); save();
    setHint(how === 'replace'
      ? 'ぶつけて作った曲を棚に並べました。再生してみよう。「元に戻す」で前の棚に戻せます。'
      : added + '個を空いているマスに足しました' + (skipped ? '(埋まっていた' + skipped + '個は足していません)' : '') + '。「元に戻す」で戻せます。');
    playBtn.focus({preventScroll:true});
  }
  recBtn.addEventListener('click', () => { rec ? recCancel() : recStart(); });
  $('recreplace').addEventListener('click', () => applyRec('replace'));
  $('recadd').addEventListener('click', () => applyRec('add'));

  /* ---------- リズム補正と風のボタン ---------- */
  const WIND_NAMES = ['なし', '弱風', '強風', '突風'];
  const WIND_TIPS = ['風はふいていません。', 'ふわっと、ゆっくり左右にゆれる風。', '大きく左右にふく、強い風。', 'ときどき、いきなり強い風がふくよ。'];
  const qBtn = $('qbtn'), windBtn = $('windbtn'), optMsg = $('optmsg');
  function paintOpts(){
    qBtn.setAttribute('aria-pressed', String(opts.q));
    qBtn.textContent = 'リズム補正 ' + (opts.q ? 'ON' : 'OFF');
    windBtn.dataset.on = opts.wind ? '1' : '0';
    windBtn.textContent = '風: ' + WIND_NAMES[opts.wind];
    windBtn.setAttribute('aria-label', '風の強さ: ' + WIND_NAMES[opts.wind] + '(おすと切りかえ)');
  }
  qBtn.addEventListener('click', () => {
    opts.q = !opts.q; saveOpts(); paintOpts();
    optMsg.textContent = opts.q
      ? 'リズム補正ON: 音を8分音符(約' + recStepSec().toFixed(2) + '秒ごと)のタイミングにそろえて鳴らすよ。きろくも同じ拍に入る。'
      : 'リズム補正OFF: ぶつかった瞬間に鳴るよ。';
  });
  windBtn.addEventListener('click', () => {
    opts.wind = (opts.wind + 1) % 4; wind.reset(); saveOpts(); paintOpts();
    optMsg.textContent = '風: ' + WIND_NAMES[opts.wind] + '。' + WIND_TIPS[opts.wind];
  });

  /* ---------- 設計モード: 板とペグを置く ---------- */
  /* 板は、なぞった2点をつなぐ。丸い端をドラッグで角度を変える。ペグはタップで置いて、ドラッグで動かす。
     配置は、この端末のブラウザに自動で覚えておく(曲コードとは別)。 */
  const RIG_KEY = 'kudamono-gakudan-rig-v1';
  function saveRig(){ try { localStorage.setItem(RIG_KEY, JSON.stringify(world.getLayout())); } catch (e) {} }
  const rigStr = () => JSON.stringify(world.getLayout());
  let rigSnap = null;                       // ひとつ前の配置(「元に戻す」用)
  function commitRig(pre){                  // 配置が変わっていたら、ひとつ前を覚えて保存する
    if (rigStr() !== pre) { rigSnap = pre; $('dundo').disabled = false; }
    saveRig();
  }
  try { const L = JSON.parse(localStorage.getItem(RIG_KEY) || 'null'); if (L) world.setLayout(L); } catch (e) {}

  const dcountEl = $('dcount'), dmsgEl = $('dmsg'), dtoolBtns = Array.from(document.querySelectorAll('.dtool'));
  const D_TIPS = {
    board: ['板: 好きな場所から、ななめにドラッグすると板ができます。板の丸い端をドラッグすると、角度を変えられます。',
            '板: ドラッグで置く。丸い端をドラッグで角度を変えるよ。'],
    peg: ['ペグ: 置きたい場所をタップ。置いたペグはドラッグで動かせます。',
          'ペグ: タップで置く。ドラッグで動かせるよ。'],
    erase: ['どける: 消したい板かペグをタップします。', 'どける: 板かペグをタップで消すよ。'],
  };
  let dmsgTimer = null;
  const dTip = () => D_TIPS[dtool][isNarrow() ? 1 : 0];
  function dSay(msg){ dmsgEl.textContent = msg; clearTimeout(dmsgTimer); dmsgTimer = setTimeout(() => { dmsgTimer = null; dmsgEl.textContent = dTip(); }, 2800); }
  function paintDesign(){
    dtoolBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === dtool)));
    const L = world.limits;
    dcountEl.textContent = '板 ' + world.boards.length + '/' + L.maxB + '・ペグ ' + world.pegs.length + '/' + L.maxP;
    if (!dmsgTimer) dmsgEl.textContent = dTip();
    rigOut.value = encodeRig(world.getLayout());
    $('dundo').disabled = !rigSnap;
  }
  dtoolBtns.forEach(b => b.addEventListener('click', () => { dtool = b.dataset.d; clearTimeout(dmsgTimer); dmsgTimer = null; paintDesign(); }));

  const ptr = (e) => { const r = stage.getBoundingClientRect(); return {x:(e.clientX - r.left) / r.width * BW, y:(e.clientY - r.top) / r.height * BH}; };
  // 指でさわる場所の当たり判定は、見た目より大きめ(論理座標 22 ≒ スマホで約 24px)
  function dHit(p, body){
    let best = null, bd = 22*22;
    world.boards.forEach((b, i) => {
      const d1 = (p.x - b.x1)**2 + (p.y - b.y1)**2, d2 = (p.x - b.x2)**2 + (p.y - b.y2)**2;
      if (d1 < bd) { bd = d1; best = {kind:'end', i, end:1}; }
      if (d2 < bd) { bd = d2; best = {kind:'end', i, end:2}; }
    });
    if (best) return best;
    bd = 1e9;
    world.pegs.forEach((q, i) => { const d = Math.hypot(p.x - q.x, p.y - q.y) - q.r; if (d < 14 && d < bd) { bd = d; best = {kind:'peg', i}; } });
    if (best || !body) return best;
    world.boards.forEach((b, i) => {
      const dx = b.x2 - b.x1, dy = b.y2 - b.y1, l2 = dx*dx + dy*dy;
      let t = l2 ? ((p.x - b.x1)*dx + (p.y - b.y1)*dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(p.x - (b.x1 + dx*t), p.y - (b.y1 + dy*t)) - world.thick;
      if (d < 14 && d < bd) { bd = d; best = {kind:'board', i}; }
    });
    return best;
  }
  stage.addEventListener('pointerdown', (e) => {
    if (mode !== 'design' || (e.pointerType === 'mouse' && e.button !== 0) || drag) return;
    e.preventDefault();
    const p = ptr(e), L = world.limits, pre = JSON.stringify(world.getLayout());
    if (dtool === 'erase') {
      const h = dHit(p, true);
      if (!h) { dSay('消したい板かペグの上をタップしてね。'); return; }
      if (h.kind === 'peg') world.removePeg(h.i); else world.removeBoard(h.i);   // 端の丸をさわったときは、その板を消す
      for (let i = 0; i < flashAt.length; i++) flashAt[i] = 0;
      commitRig(pre); paintDesign(); return;
    }
    const h = dHit(p, false);
    if (h && h.kind === 'end') drag = {type:'end', i:h.i, end:h.end};
    else if (h && h.kind === 'peg') drag = {type:'peg', i:h.i};
    else if (dtool === 'peg') {
      const i = world.addPeg(p.x, p.y);
      if (i < 0) { dSay('ペグは' + L.maxP + '個までだよ。「どける」で減らしてね。'); return; }
      drag = {type:'peg', i};
    } else {
      if (world.boards.length >= L.maxB) { dSay('板は' + L.maxB + '枚までだよ。「どける」で減らしてね。'); return; }
      drag = {type:'new', x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    }
    drag.id = e.pointerId; drag.pre = pre;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    paintDesign();
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = ptr(e);
    if (drag.type === 'end') world.moveEnd(drag.i, drag.end, p.x, p.y);
    else if (drag.type === 'peg') world.movePeg(drag.i, p.x, p.y);
    else { drag.x1 = p.x; drag.y1 = p.y; }
  });
  function dragEnd(e){
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (d.type === 'new' && e.type === 'pointerup') {
      if (world.addBoard(d.x0, d.y0, d.x1, d.y1) === null) dSay('もう少し長くドラッグしてね。');
    }
    commitRig(d.pre); paintDesign();
  }
  stage.addEventListener('pointerup', dragEnd);
  stage.addEventListener('pointercancel', dragEnd);
  $('dreset').addEventListener('click', () => { const pre = rigStr(); world.resetLayout(); commitRig(pre); paintDesign(); dSay('はじめの配置にもどしました。'); });
  $('dclear').addEventListener('click', () => { const pre = rigStr(); world.emptyLayout(); commitRig(pre); paintDesign(); dSay('板とペグを、ぜんぶどけました。'); });
  $('dundo').addEventListener('click', () => {
    if (!rigSnap) return;
    try { world.setLayout(JSON.parse(rigSnap)); } catch (e) {}
    rigSnap = null; saveRig(); paintDesign(); dSay('ひとつ前の配置に戻しました。');
  });

  /* ---------- 装置コード: 板とペグの配置を文字にする ---------- */
  /* KR1:板;板;…|ペグ;ペグ;…   板は x1,y1,x2,y2(整数)、ペグは x,y。曲コード(KG)とは別もの。
     例: KR1:0,115,236,164;360,231,124,280|300,176;60,305   読み込むときは形・数・長さをすべて確かめてから置きかえる。 */
  function encodeRig(L){
    return 'KR1:' + L.boards.map(b => [b.x1, b.y1, b.x2, b.y2].join(',')).join(';') + '|' + L.pegs.map(q => q.x + ',' + q.y).join(';');
  }
  function decodeRig(str){
    const t = String(str).normalize('NFKC').replace(/\s+/g, '');
    const m = /^KR1:([0-9,;]*)\|([0-9,;]*)$/.exec(t);
    if (!m) return null;
    const L = {boards:[], pegs:[]};
    for (const part of m[1].split(';').filter(Boolean)) {
      const a = part.split(',');
      if (a.length !== 4 || !a.every(v => /^\d{1,3}$/.test(v))) return null;
      L.boards.push({x1:+a[0], y1:+a[1], x2:+a[2], y2:+a[3]});
    }
    for (const part of m[2].split(';').filter(Boolean)) {
      const a = part.split(',');
      if (a.length !== 2 || !a.every(v => /^\d{1,3}$/.test(v))) return null;
      L.pegs.push({x:+a[0], y:+a[1]});
    }
    const tmp = makeWorld();                  // 仮の世界で確かめる(上限・短すぎる板は、ここではじく)
    if (!tmp.setLayout(L) || tmp.boards.length !== L.boards.length) return null;
    return tmp.getLayout();
  }

  const RIGS_KEY = 'kudamono-gakudan-rigs-v1', MAX_RIGS = 12;
  const rigNameEl = $('rigname'), rigListEl = $('riglist'), rigMsgEl = $('rigmsg'), rigOut = $('rigout'), rigIn = $('rigin'), rigCodeMsg = $('rigcodemsg');
  function readRigs(){
    try {
      const a = JSON.parse(localStorage.getItem(RIGS_KEY) || '[]');
      return Array.isArray(a) ? a.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string' && decodeRig(x.code)) : [];
    } catch (e) { return []; }
  }
  function writeRigs(a){ try { localStorage.setItem(RIGS_KEY, JSON.stringify(a)); return true; } catch (e) { return false; } }
  let rigDelArm = null, rigDelTimer = null;
  function renderRigs(){
    if (!storageOk) {
      rigListEl.innerHTML = '';
      rigMsgEl.textContent = 'この表示では端末への保存ができません。右の装置コードをコピーして控えてください。';
      return;
    }
    const a = readRigs();
    if (!a.length) { rigListEl.innerHTML = '<li class="empty">まだありません。名前をつけて「保存」すると、ここに並びます。</li>'; return; }
    rigListEl.innerHTML = a.map(x => {
      const d = decodeRig(x.code), armed = rigDelArm === x.id;
      return '<li><span class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</span><span class="meta">板' + d.boards.length + '・ペグ' + d.pegs.length + '</span>' +
        '<button type="button" class="btn sm" data-act="open" data-id="' + esc(x.id) + '">ひらく</button>' +
        '<button type="button" class="btn sm' + (armed ? ' danger' : '') + '" data-act="del" data-id="' + esc(x.id) + '">' + (armed ? '本当に?' : '消す') + '</button></li>';
    }).join('');
  }
  function applyRig(L){ const pre = rigStr(); world.setLayout(L); commitRig(pre); paintDesign(); }
  function saveRigNamed(){
    if (!storageOk) { rigMsgEl.textContent = 'この表示では保存できません。装置コードで控えてね。'; return; }
    const a = readRigs();
    let name = rigNameEl.value.trim().slice(0, 20);
    if (!name) name = '装置' + (a.length + 1);
    const code = encodeRig(world.getLayout());
    const same = a.find(x => x.name === name);
    if (same) { same.code = code; rigMsgEl.textContent = '「' + name + '」を上書きしました。'; }
    else {
      if (a.length >= MAX_RIGS) { rigMsgEl.textContent = '保存できるのは' + MAX_RIGS + '個までです。いらない装置を消してね。'; return; }
      a.unshift({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, code});
      rigMsgEl.textContent = '「' + name + '」を保存しました。';
    }
    if (!writeRigs(a)) rigMsgEl.textContent = '保存に失敗しました。装置コードで控えてね。';
    rigNameEl.value = '';
    renderRigs();
  }
  rigListEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const a = readRigs(), x = a.find(r => r.id === b.dataset.id); if (!x) return;
    if (b.dataset.act === 'open') {
      const L = decodeRig(x.code); if (!L) return;
      applyRig(L);
      rigMsgEl.textContent = '「' + x.name + '」をひらきました。「元に戻す」で前の配置に戻せます。';
    } else if (rigDelArm === x.id) {
      writeRigs(a.filter(r => r.id !== x.id)); rigDelArm = null; clearTimeout(rigDelTimer);
      rigMsgEl.textContent = '「' + x.name + '」を消しました。';
      renderRigs();
    } else {
      rigDelArm = x.id; clearTimeout(rigDelTimer);
      rigDelTimer = setTimeout(() => { rigDelArm = null; renderRigs(); }, 3000);
      renderRigs();
    }
  });
  $('saverig').addEventListener('click', saveRigNamed);
  rigNameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveRigNamed(); });
  /* ぶつける画面の「装置」えらび: 保存した装置と、はじめの配置を、すぐ切りかえる */
  const pickRow = $('rigpickrow'), pickSel = $('rigpick');
  const DEF_LAYOUT = makeWorld().getLayout(), DEF_CODE = encodeRig(DEF_LAYOUT);
  const canon = (code) => { const L = decodeRig(code); return L ? encodeRig(L) : null; };
  function refreshRigPick(){
    const cur = encodeRig(world.getLayout()), a = storageOk ? readRigs() : [];
    const hit = a.find(x => canon(x.code) === cur);
    const sel = hit ? 'rig:' + hit.id : cur === DEF_CODE ? 'def' : 'cur';
    let h = sel === 'cur' ? '<option value="cur">いまの配置(未保存)</option>' : '';
    h += '<option value="def">はじめの配置</option>';
    h += a.map(x => '<option value="rig:' + esc(x.id) + '">' + esc(x.name) + '</option>').join('');
    pickSel.innerHTML = h; pickSel.value = sel;
  }
  function pickRig(v){
    if (rec) return;
    let L = null, name = '';
    if (v === 'def') { L = DEF_LAYOUT; name = 'はじめの配置'; }
    else if (v.startsWith('rig:')) { const x = readRigs().find(r => 'rig:' + r.id === v); if (x) { L = decodeRig(x.code); name = '「' + x.name + '」'; } }
    if (!L) { refreshRigPick(); return; }
    applyRig(L);
    world.clear(); ripples.length = 0; jamAcc = 0; jamShown = false;       // 配置が変わるので、落ちている果物は片づける
    for (let i = 0; i < flashAt.length; i++) flashAt[i] = 0;
    refreshRigPick();
    setHint('装置を' + name + 'にしました。果物は片づけたよ。', true);
  }
  pickSel.addEventListener('change', () => pickRig(pickSel.value));
  function stepRig(dir){
    const vals = Array.from(pickSel.options).map(o => o.value).filter(v => v !== 'cur');
    if (!vals.length) return;
    const i = vals.indexOf(pickSel.value);
    pickRig(vals[i < 0 ? (dir > 0 ? 0 : vals.length - 1) : (i + dir + vals.length) % vals.length]);
  }
  $('rigprev').addEventListener('click', () => stepRig(-1));
  $('rignext').addEventListener('click', () => stepRig(1));

  $('copyrig').addEventListener('click', () => {
    rigOut.value = encodeRig(world.getLayout());
    const done = () => { rigCodeMsg.textContent = 'コピーしました。'; };
    const fallback = () => { rigOut.focus(); rigOut.select(); rigCodeMsg.textContent = '選択しました。コピーしてください。'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(rigOut.value).then(done, fallback);
    else fallback();
  });
  $('loadrig').addEventListener('click', () => {
    const L = decodeRig(rigIn.value);
    if (!L) { rigCodeMsg.textContent = '装置コードの形が違うようです。KR1: で始まるコードを貼ってください。(板は6枚・ペグは8個まで、板は短すぎないこと)'; return; }
    applyRig(L); rigIn.value = '';
    rigCodeMsg.textContent = '読み込みました。「元に戻す」で前の配置に戻せます。';
  });

  /* ---------- あそびかたの切り替え ---------- */
  const transportEl = $('transport'), tbtnsEl = $('tbtns'), songsEl = $('songs'), arenaEl = $('arena');
  const MODE_IDS = {shelf:'mode-shelf', bounce:'mode-bounce', design:'mode-design'};
  function setMode(m){
    if (m === mode) return;
    if (playing) stop();
    if (rec) recCancel();
    drag = null;
    mode = m;
    Object.keys(MODE_IDS).forEach(k => $(MODE_IDS[k]).setAttribute('aria-pressed', String(k === m)));
    const b = m !== 'shelf', d = m === 'design';
    // ぶつけるモードでは再生ボタンなどを隠し、テンポだけ残す(きろくのテンポに使う)。設計モードではテンポも要らない。
    playBtn.hidden = b; tbtnsEl.hidden = b; transportEl.classList.toggle('tempo-only', b); transportEl.hidden = d;
    shelvesEl.hidden = b; songsEl.hidden = b; arenaEl.hidden = !b;
    $('trayset').hidden = d; $('mixer').hidden = d; $('dbar').hidden = !d;
    trayEl.querySelector('.t-tie').hidden = b; trayEl.style.setProperty('--tn', b ? 9 : 10);   // 「つなぐ」は棚だけ
    if (b && tool === 'tie') setTool(lastFruit);
    $('playctl').hidden = d; $('dacts').hidden = !d; $('rigs').hidden = !d;
    stage.classList.toggle('designing', d);
    stage.setAttribute('aria-label', d ? '板とペグを置く設計の画面。ドラッグで板、タップでペグを置けます。' : '果物が落ちて転がる遊び場。タップした場所から果物が落ちます。');
    if (d) { world.clear(); ripples.length = 0; jamAcc = 0; jamShown = false; clearTimeout(dmsgTimer); dmsgTimer = null; paintDesign(); }   // 設計中は、落ちている果物をいったん片づける
    $('rigpickrow').hidden = d;
    if (m === 'bounce') refreshRigPick();
    if (b) { if (!bRun) bounceStart(); updateRecHint(); } else bounceStop();
    setHint(toolTip());
  }
  $('mode-shelf').addEventListener('click', () => setMode('shelf'));
  $('mode-bounce').addEventListener('click', () => setMode('bounce'));
  $('mode-design').addEventListener('click', () => setMode('design'));

  buildMixer();
  paintOpts();
  paintAll();
  setTool(tool);
  updateCode(); renderSongs(); renderRigs();
})();
</script>

</body></html>
